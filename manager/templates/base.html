<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}弹幕机器人多账号管理{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f6fa; }
    .status-dot { width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px; }
    .dot-running { background:#28a745;box-shadow:0 0 4px #28a745; }
    .dot-stopped { background:#bbb; }
    .nav-link.active { font-weight:600;color:#fff !important; }
    .card { box-shadow:0 1px 3px rgba(0,0,0,.06); }
    table.tbl-compact td,table.tbl-compact th { padding:.5rem .6rem; }
    .profit-pos { color:#198754;font-weight:600; }
    .profit-neg { color:#dc3545;font-weight:600; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
  <div class="container">
    <a class="navbar-brand" href="/">🎮 弹幕机器人管理面板</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <div class="navbar-nav">
        <a class="nav-link {{ 'active' if request.path == '/' else '' }}" href="/">总览</a>
        <a class="nav-link {{ 'active' if request.path.startswith('/deploy') else '' }}" href="/deploy">新增账号</a>
        <a class="nav-link {{ 'active' if request.path.startswith('/blindbox') else '' }}" href="/blindbox">盲盒盈亏</a>
      </div>
    </div>
  </div>
</nav>
<div class="container py-3">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
